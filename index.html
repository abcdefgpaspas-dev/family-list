<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#3E7B4F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="みどりのかご">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>みどりのかご</title>
<style>
:root{
  --g:#3E7B4F; --g2:#2E5F3C; --leaf:#8BC34A; --leafL:#E6F4D9; --bg:#F4FAF4;
  --card:#fff; --line:#DCEBDD; --txt:#22332A; --sub:#6B7F70; --warn:#C0563A;
  --red:#D2453A; --redL:#FDE3DC; --org:#C26A00; --orgL:#FFEACC;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;font-size:17px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}

/* ヘッダー */
#hdr{position:sticky;top:0;z-index:20;background:var(--g);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 0}
.hrow{display:flex;align-items:center;gap:8px}
.logo{font-weight:800;font-size:19px;letter-spacing:.02em}
.fam{font-size:13px;opacity:.85}
.hsp{flex:1}
.mems{display:flex;padding-left:8px}
.av{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font-size:21px;border:2px solid #fff;flex:none;position:relative;overflow:hidden;line-height:1}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.mems .av{margin-left:-8px}
.av.sm{width:26px;height:26px;font-size:15px;border-width:1.5px}
.av.xs{width:19px;height:19px;font-size:11px;border-width:1px;vertical-align:-4px}
.av.lg{width:76px;height:76px;font-size:46px;border-width:3px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.gear{font-size:22px;padding:4px 2px 4px 4px}
.net{font-size:11px;background:#C0563A;border-radius:8px;padding:2px 6px}
.due{background:#FFC46B;color:#5A2E00;font-weight:800;border-radius:14px;padding:4px 10px;font-size:13px;white-space:nowrap}
.due.red{background:#FF7A66;color:#fff}
#tabs{display:flex;gap:4px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:10px 14px 11px;border-radius:14px 14px 0 0;color:#E4F2E6;font-weight:600;font-size:15px;white-space:nowrap}
.tab.on{background:var(--bg);color:var(--g2)}
.tab .cnt{font-size:12px;background:var(--leaf);color:#fff;border-radius:9px;padding:1px 7px;margin-left:5px}
.tab .cnt.hot{background:#E8604E}
.tab.on .ed{margin-left:6px;opacity:.6;font-size:13px}
.tab.add{font-size:20px;padding:6px 14px}

/* バナー */
#banners{padding:0 12px;max-width:640px;margin:0 auto}
.banner{margin-top:10px;border-radius:14px;padding:11px 14px;background:linear-gradient(90deg,#FFF6D8,#FDF0C2);
  border:1px solid #F0DC8C;display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;animation:pop .3s}
.banner.me{background:linear-gradient(90deg,#E6F4D9,#D5EDC1);border-color:#B8DD99}
.banner.priv{background:#F1EEF8;border-color:#D6CDEB}
.banner .t{flex:1}
.banner button{background:#fff;border-radius:10px;padding:7px 12px;font-size:14px;font-weight:700;color:var(--g2);border:1px solid var(--line)}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.privnote{background:#F1EEF8;border:1px dashed #BFB2DF;color:#4B3F72;border-radius:12px;padding:9px 12px;font-size:14px;margin-top:12px}

#wrap{padding:6px 12px 140px;max-width:640px;margin:0 auto}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 6px;align-items:center}
.btn{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:700;font-size:15px;color:var(--g2)}
.btn.pri{background:var(--g);color:#fff;border-color:var(--g)}
.btn.warn{color:var(--warn)}
.btn.full{width:100%;padding:14px}
.seg{display:flex;background:#E7F0E7;border-radius:12px;padding:3px}
.seg button{padding:7px 13px;border-radius:10px;font-size:14px;font-weight:700;color:var(--sub)}
.seg button.on{background:#fff;color:var(--g2);box-shadow:0 1px 3px rgba(0,0,0,.1)}

.usual{margin:8px 0 4px}
.usual h4,.sec{font-size:13px;color:var(--sub);margin:16px 4px 6px;font-weight:800;display:flex;align-items:center;gap:8px}
.sec .n{font-weight:600;opacity:.8}
.sec.red{color:var(--red)} .sec.orange{color:var(--org)}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--leafL);color:var(--g2);border-radius:20px;padding:8px 13px;font-size:15px;font-weight:600;border:1px solid #CBE6B3;display:inline-flex;align-items:center;gap:5px}
.chip.sel{background:var(--g);color:#fff;border-color:var(--g)}

/* 項目 */
.item{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:12px 10px 12px 12px;
  margin:8px 0;box-shadow:0 1px 3px rgba(40,80,50,.08);border:1px solid #E8F1E8;min-height:64px;transition:opacity .2s}
.item.late{border-left:6px solid #E8604E}
.item.soon{border-left:6px solid #F5A54A}
.chk{width:34px;height:34px;border-radius:50%;border:2.5px solid #A9CDA9;flex:none;display:flex;align-items:center;justify-content:center;color:transparent;font-size:18px;font-weight:900}
.item.done .chk{background:var(--leaf);border-color:var(--leaf);color:#fff}
.body{flex:1;min-width:0}
.nm{font-size:18px;font-weight:600;word-break:break-all}
.qty{font-size:14px;color:var(--g);font-weight:700;margin-left:6px}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;font-size:12px;color:var(--sub);align-items:center}
.tag{background:#F1F6F1;border-radius:8px;padding:2px 7px}
.tag.cl{background:#FFF3CC;color:#8A6A00;font-weight:700}
.tag.memo{background:none;padding:2px 0}
.tag.dt{background:#EAF2FB;color:#2B5C9A;font-weight:700;font-size:13px}
.tag.dt.red{background:var(--redL);color:var(--red)}
.tag.dt.orange{background:var(--orgL);color:var(--org)}
.item.done .nm{text-decoration:line-through;color:#9AAA9E}
.item.other{opacity:.45}
.item.mine{border-color:#B8DD99;background:#FAFFF5}
.claim{flex:none;border:1.5px dashed #B8D2B8;border-radius:12px;padding:6px 8px;font-size:12px;font-weight:700;color:var(--g);min-width:56px;text-align:center;line-height:1.2}
.claim.on{border-style:solid;border-color:var(--leaf);background:var(--leafL)}
.whos{display:flex;flex:none;padding-left:8px}
.whos .av{margin-left:-8px;border-color:#fff}
.more{flex:none;font-size:20px;color:#9AB09D;padding:6px 2px 6px 4px}
.empty{text-align:center;color:var(--sub);padding:44px 10px;font-size:15px;line-height:1.8}
.donehd{display:flex;align-items:center;gap:8px;margin:20px 4px 4px}
.donehd .lbl{flex:1;font-weight:700;color:var(--sub);font-size:14px;padding:8px 0;text-align:left}
.small{font-size:13px;padding:7px 11px;border-radius:11px}

/* 下部ボタン */
#fab{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:64px;height:64px;border-radius:50%;
  background:var(--g);color:#fff;font-size:36px;box-shadow:0 6px 16px rgba(46,95,60,.35);z-index:30;line-height:1}
#mic{position:fixed;right:94px;bottom:calc(30px + env(safe-area-inset-bottom));width:50px;height:50px;border-radius:50%;
  background:#fff;color:var(--g);font-size:24px;box-shadow:0 4px 12px rgba(46,95,60,.25);z-index:30;border:1.5px solid var(--line)}
#mic.rec{background:var(--warn);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.1)}}

/* シート */
#ov{position:fixed;inset:0;background:rgba(20,40,25,.38);z-index:50;display:flex;align-items:flex-end;justify-content:center}
#sheet{background:#fff;width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));
  max-height:90vh;overflow:auto;animation:up .22s}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
#sheet h3{margin:0 0 12px;font-size:19px;color:var(--g2);display:flex;align-items:center}
#sheet h3 .x{margin-left:auto;font-size:24px;color:var(--sub);padding:0 4px}
.fld{margin:12px 0}
.fld>label{display:block;font-size:13px;color:var(--sub);font-weight:700;margin-bottom:6px}
.in{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:17px;background:#FBFDFB}
.in:focus{outline:2px solid var(--leaf);border-color:transparent}
.row2{display:flex;gap:10px}.row2>*{flex:1}
.wrapchips{display:flex;flex-wrap:wrap;gap:7px}
.hint{font-size:12px;color:var(--sub);margin-top:5px;line-height:1.6}
.mlist .mi{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #EEF4EE}
.code{font-size:24px;font-weight:800;letter-spacing:.04em;color:var(--g2);background:var(--leafL);border-radius:12px;padding:10px 14px;text-align:center;user-select:all;word-break:break-all}
.code.pk{font-size:15px;background:#F1EEF8;color:#4B3F72}

/* アバター選択 */
.avpick{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.emo{width:48px;height:48px;border-radius:50%;font-size:28px;border:2px solid transparent;background:#F1F6F1;line-height:1}
.emo.sel{border-color:var(--g);background:var(--leafL)}
.tone{width:38px;height:38px;border-radius:50%;font-size:20px;background:#F1F6F1;border:2px solid transparent}
.tone.sel{border-color:var(--g)}
.col{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.col.sel{box-shadow:0 0 0 3px var(--g)}

/* 初回設定 */
#setup{position:fixed;inset:0;z-index:60;background:linear-gradient(180deg,#E6F4D9,#F4FAF4 40%);overflow:auto;padding:calc(30px + env(safe-area-inset-top)) 20px 40px}
#setup .box{max-width:460px;margin:0 auto}
#setup .hero{text-align:center;margin-bottom:18px}
#setup .hero img{width:84px;height:84px;border-radius:22px;box-shadow:0 6px 16px rgba(46,95,60,.25)}
#setup h1{color:var(--g2);margin:10px 0 2px;font-size:26px}
.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 1px 4px rgba(40,80,50,.08)}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#2E3B32;color:#fff;padding:10px 16px;border-radius:12px;
  font-size:15px;z-index:80;opacity:0;transition:opacity .25s;pointer-events:none;max-width:86vw;text-align:center}
#toast.on{opacity:.95}
</style>
</head>
<body>

<header id="hdr" class="hide">
  <div class="hrow">
    <div><div class="logo">🌿 みどりのかご</div><div class="fam" id="famName"></div></div>
    <div class="hsp"></div>
    <span class="net hide" id="net">オフライン</span>
    <button class="due hide" id="due"></button>
    <div class="mems" id="mems"></div>
    <button class="gear" id="gear" aria-label="設定">⚙️</button>
  </div>
  <nav id="tabs"></nav>
</header>
<div id="banners"></div>
<main id="wrap"></main>
<button id="mic" class="hide" aria-label="音声で追加">🎤</button>
<button id="fab" class="hide" aria-label="追加">＋</button>
<div id="ov" class="hide"><div id="sheet"></div></div>
<div id="setup" class="hide"></div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script>
/* ===================== 基本 ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = { get:k=>localStorage.getItem('mk_'+k), set:(k,v)=>localStorage.setItem('mk_'+k,v), del:k=>localStorage.removeItem('mk_'+k) };
const TS = firebase.database.ServerValue.TIMESTAMP;
firebase.initializeApp(window.FIREBASE_CONFIG);
const db = firebase.database();

let FAM = LS.get('fam'), ME = LS.get('me'), cur = LS.get('list'), showDone = false;
let D = {};          // 家族の共有データ（meta, members, lists, items, stores, history, shopping）
let P = {};          // 自分だけの非公開データ（lists, items）
let PK = null;       // 非公開データの秘密キー（この端末のlocalStorageにだけ保存）
let loaded = new Set(), refs = [], privRef = null, migrated = false;
let startType = new URLSearchParams(location.search).get('list'); // ホーム画面ショートカット用
const R = p => db.ref('familylist/' + FAM + (p ? '/' + p : ''));

const CATS = ['野菜・果物','肉・魚','乳製品・卵','パン・主食','冷凍食品','調味料','お菓子・飲料','日用品','その他'];
const CAT_ICON = {'野菜・果物':'🥬','肉・魚':'🍖','乳製品・卵':'🥚','パン・主食':'🍞','冷凍食品':'🧊','調味料':'🧂','お菓子・飲料':'🍪','日用品':'🧻','その他':'📦'};
const DEF_STORES = ['スーパー','ドラッグストア','コストコ','その他'];
const PEOPLE = ['👨','👩','🧔','👱‍♂️','👱‍♀️','👨‍🦱','👩‍🦱','👨‍🦰','👩‍🦰','👨‍🦳','👩‍🦳','👨‍🦲','🧑','👴','👵','👦','👧','🧒','👶'];
const TONES = ['', '🏻', '🏼', '🏽', '🏾', '🏿'];
const COLORS = ['#3E7B4F','#8BC34A','#F2A65A','#E57373','#64B5F6','#BA68C8','#FFD54F','#4DB6AC'];
const SHOP_TTL = 4 * 3600e3; // 買い物中表示は4時間で自動的に消える
const TYPES = { shop:'買い物', check:'チェックリスト', todo:'やること（期限つき）' };

// 肌色を付ける（ZWJ連結の絵文字は先頭の人物に付ける）
const withTone = (e, t) => { const a = [...e]; return t ? a[0] + t + a.slice(1).join('') : e; };
const splitTone = e => { const t = (e.match(/[\u{1F3FB}-\u{1F3FF}]/u) || [''])[0]; const b = e.replace(/[\u{1F3FB}-\u{1F3FF}]/gu, ''); return { base: PEOPLE.includes(b) ? b : PEOPLE[0], tone: t }; };

/* ===================== カテゴリ自動推定（簡易辞書） ===================== */
const DICT = {
 '野菜・果物':'キャベツ レタス トマト きゅうり 胡瓜 玉ねぎ たまねぎ 玉葱 にんじん 人参 じゃがいも 馬鈴薯 大根 だいこん 白菜 はくさい ねぎ 長ねぎ ほうれん草 ほうれんそう 小松菜 ピーマン なす 茄子 ブロッコリー もやし きのこ しめじ えのき 椎茸 しいたけ まいたけ エリンギ かぼちゃ ごぼう れんこん さつまいも 里芋 生姜 しょうが にんにく 野菜 サラダ アボカド バナナ りんご 林檎 みかん いちご 苺 ぶどう キウイ レモン メロン すいか 梨 柿 桃 果物 フルーツ オクラ ズッキーニ パプリカ 大葉 水菜 セロリ コーン 豆苗 ニラ にら 春菊 チンゲン菜 グレープフルーツ オレンジ',
 '肉・魚':'肉 豚肉 豚 牛肉 鶏肉 鶏 ささみ ひき肉 挽肉 ミンチ ベーコン ハム ソーセージ ウインナー 魚 鮭 さけ サーモン まぐろ 鮪 刺身 さしみ さば 鯖 あじ 鯵 いわし ぶり たら 鱈 えび 海老 いか たこ あさり しらす ちくわ かまぼこ ツナ 明太子 たらこ 手羽',
 '乳製品・卵':'牛乳 ミルク 卵 たまご 玉子 ヨーグルト チーズ バター 生クリーム 豆乳 豆腐 とうふ 納豆 なっとう 油揚げ 厚揚げ マーガリン',
 'パン・主食':'パン 食パン 米 お米 ごはん ご飯 パスタ スパゲッティ うどん そば 蕎麦 ラーメン 麺 焼きそば シリアル グラノーラ もち 餅 小麦粉 ホットケーキミックス 春雨 パン粉',
 '冷凍食品':'冷凍 アイス 冷食 餃子 ぎょうざ 冷凍うどん 冷凍ポテト 唐揚げ からあげ フライドポテト',
 '調味料':'醤油 しょうゆ 味噌 みそ 塩 砂糖 酢 みりん 料理酒 油 サラダ油 オリーブオイル ごま油 マヨネーズ ケチャップ ソース ドレッシング だし 出汁 コンソメ カレールー ルー 胡椒 こしょう ポン酢 めんつゆ 片栗粉 わさび からし 鶏がらスープ ふりかけ ジャム はちみつ',
 'お菓子・飲料':'お菓子 菓子 チョコ チョコレート ポテチ ポテトチップス クッキー せんべい グミ ガム ジュース お茶 茶 水 コーヒー 紅茶 ビール 酒 炭酸 麦茶 ゼリー プリン ヤクルト スナック 飴 あめ',
 '日用品':'ティッシュ トイレットペーパー トイレ 洗剤 食器用洗剤 シャンプー リンス コンディショナー ボディソープ 石鹸 せっけん 歯ブラシ 歯磨き粉 ハミガキ ラップ アルミホイル ゴミ袋 ごみ袋 電池 オムツ おむつ おしりふき マスク 綿棒 キッチンペーパー スポンジ 柔軟剤 ハンドソープ 絆創膏 ばんそうこう 薬 生理用品 ハンドクリーム 漂白剤 ジップロック'
};
const kata = s => s.replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60)).toLowerCase();
const DICT_K = []; for (const c in DICT) for (const w of DICT[c].split(' ')) DICT_K.push([kata(w), c]);
function guessCat(name){
  const k = kata(name || ''); let best = null, len = 0;
  for (const [w, c] of DICT_K) if (k.includes(w) && w.length > len) { best = c; len = w.length; } // 最長一致
  return best || 'その他';
}

/* ===================== 便利関数 ===================== */
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3);
const rand32 = () => { const c = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789', a = crypto.getRandomValues(new Uint8Array(32)); return [...a].map(x => c[x % c.length]).join(''); };
const key = s => s.replace(/[.#$\[\]\/]/g, '_');
const pad = n => String(n).padStart(2, '0');
const fmt = t => { if(!t) return ''; const d = new Date(t); return `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${pad(d.getMinutes())}`; };
const member = id => (D.members && D.members[id]) || { name:'?', emoji:'🧑', color:'#ccc' };
const avatarOf = (m, cls='') => `<span class="av ${cls}" style="background:${esc(m.color || '#ccc')}">${m.photo ? `<img src="${esc(m.photo)}" alt="">` : esc(m.emoji)}</span>`;
const avatar = (id, cls='') => avatarOf(member(id), cls);
const stores = () => D.stores ? Object.values(D.stores) : DEF_STORES;
const otherNames = () => Object.entries(D.members || {}).filter(([id]) => id !== ME).map(([, m]) => m.name + 'さん').join('・') || 'ほかの家族';
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2400); }

// ---- 共有リストと非公開リストを区別して扱う ----
const isPriv = lid => !!(P.lists && P.lists[lid]);
const pbase = lid => isPriv(lid) ? 'private/' + PK + '/' : '';
const LR = lid => R(pbase(lid) + 'items/' + lid);          // 項目の保存先
const listRef = lid => R(pbase(lid) + 'lists/' + lid);     // リスト情報の保存先
const listObj = lid => (isPriv(lid) ? P.lists[lid] : (D.lists || {})[lid]) || {};
function lists(){
  const a = Object.entries(D.lists || {}).map(([id, l]) => ({ id, ...l, priv:false }));
  const b = Object.entries(P.lists || {}).map(([id, l]) => ({ id, ...l, priv:true }));
  return [...a, ...b].sort((x, y) => (x.order || 0) - (y.order || 0));
}
function items(lid){
  const src = (isPriv(lid) ? P.items : D.items) || {};
  return Object.entries(src[lid] || {}).map(([id, it]) => ({ id, ...it })).sort((a, b) => (a.at || 0) - (b.at || 0));
}
const curList = () => listObj(cur);
const getItem = id => { const src = (isPriv(cur) ? P.items : D.items) || {}; return (src[cur] || {})[id] || null; };
const IR = id => LR(cur).child(id);

// ---- 買い物モード（非公開リストからの買い物は端末内だけ＝相手に出さない） ----
function activeShops(){ const now = Date.now(); return Object.entries(D.shopping || {}).filter(([, s]) => s && now - (s.since || 0) < SHOP_TTL); }
function privShop(){ try { const s = JSON.parse(LS.get('pshop') || 'null'); return s && Date.now() - s.since < SHOP_TTL ? s.store : null; } catch(e) { return null; } }
function myShop(lid = cur){
  if (isPriv(lid)) return privShop();
  const s = D.shopping && D.shopping[ME]; return s && Date.now() - (s.since || 0) < SHOP_TTL ? s.store : null;
}

// 「牛乳2本」→ 名前と数量に分ける
function parseQty(s){
  const m = s.match(/^(.+?)\s*([0-9０-９]+\s*(個|本|パック|袋|枚|kg|g|L|ml|缶|箱|玉|束|房|丁|合|切れ|尾|つ)?)$/);
  return m && m[1].trim() ? { name: m[1].trim(), qty: m[2] } : { name: s.trim(), qty: '' };
}
// 「卵と牛乳」「卵、牛乳」を分割
function splitNames(t, voice){
  t = t.replace(/[。．!！]/g, '').replace(/(を|も)?(買って(きて)?|買う|かう|追加(して)?|お願い(します)?|ください)$/, '');
  const re = voice ? /[、,，・\s]+|(?<=\S)と(?=\S)/ : /[、,，\n]+/;
  return t.split(re).map(s => s.trim()).filter(Boolean);
}

/* ===================== 日付（やることリスト） ===================== */
const WD = '日月火水木金土';
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => ymd(new Date());
const dayDiff = s => Math.round((pYmd(s) - pYmd(today())) / 864e5);
const dLabel = s => { const d = pYmd(s); return `${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`; };
function nextDate(s, rep, rday){
  const d = pYmd(s), day = rday || d.getDate();
  const n = rep === 'yearly' ? new Date(d.getFullYear() + 1, d.getMonth(), 1) : new Date(d.getFullYear(), d.getMonth() + 1, 1);
  const last = new Date(n.getFullYear(), n.getMonth() + 1, 0).getDate();
  n.setDate(Math.min(day, last)); return ymd(n); // 31日→月末に合わせる
}
// 「習字代振込 〜12/5」→ 期限日、「車検 11/6」→ 予定日
function parseTodo(t){
  const m = t.match(/^(.*?)\s*([〜~～])?\s*(\d{1,2})\s*[\/月]\s*(\d{1,2})\s*日?\s*(まで(に)?)?$/);
  if (!m || !m[1].trim()) return { name: t.trim() };
  const mo = +m[3], da = +m[4]; if (mo < 1 || mo > 12 || da < 1 || da > 31) return { name: t.trim() };
  const now = new Date(); let d = new Date(now.getFullYear(), mo - 1, da);
  if ((d - now) / 864e5 < -60) d = new Date(now.getFullYear() + 1, mo - 1, da); // 2か月以上前なら来年扱い
  return { name: m[1].trim(), date: ymd(d), dtype: (m[2] || m[5]) ? 'due' : 'on' };
}
const GROUPS = [['⚠️ 期限切れ・過ぎた予定', 'red'], ['🔶 今日・明日', 'orange'], ['📅 今週', ''], ['🗓 来週以降', ''], ['📝 日付なし', '']];
function grp(i){
  if (!i.date) return 4; const n = dayDiff(i.date);
  if (n < 0) return 0; if (n <= 1) return 1;
  const toSun = (7 - new Date().getDay()) % 7; // 日曜までを「今週」
  return n <= toSun ? 2 : 3;
}
// 近い期限（期限切れ＋3日以内）の件数
function urgentCount(){
  let n = 0, late = 0;
  for (const l of lists()) if (l.type === 'todo') for (const i of items(l.id)) if (!i.done && i.date) { const d = dayDiff(i.date); if (d <= 3) n++; if (d < 0) late++; }
  return { n, late };
}

/* ===================== アバター選択（初回設定・プロフィール共通） ===================== */
function avatarPicker(sv, rd){ // sv=状態オブジェクト名, rd=再描画関数名
  const s = window.eval(sv);
  const prev = avatarOf({ emoji: withTone(s.base, s.tone), color: s.color, photo: s.photo }, 'lg');
  return `<div class="fld"><label>アバター</label>
    <div class="avpick">${prev}<div>
      <button type="button" class="btn small" onclick="pickPhoto(${sv},${rd})">📷 写真を使う</button>
      ${s.photo ? `<button type="button" class="btn small warn" onclick="${sv}.photo=null;${rd}()">写真をやめる</button>` : ''}
      <div class="hint">写真は端末で200pxに縮小して保存します</div></div></div>
    ${s.photo ? '' : `<div class="wrapchips" style="margin-bottom:8px">${TONES.map(t => `<button type="button" class="tone ${t === s.tone ? 'sel' : ''}" onclick="${sv}.tone='${t}';${rd}()">${withTone('✋', t)}</button>`).join('')}</div>
    <div class="wrapchips">${PEOPLE.map(e => `<button type="button" class="emo ${e === s.base ? 'sel' : ''}" onclick="${sv}.base='${e}';${rd}()">${withTone(e, s.tone)}</button>`).join('')}</div>`}
  </div>
  <div class="fld"><label>色</label><div class="wrapchips">${COLORS.map(c => `<button type="button" class="col ${c === s.color ? 'sel' : ''}" style="background:${c}" onclick="${sv}.color='${c}';${rd}()"></button>`).join('')}</div></div>`;
}
function pickPhoto(state, redraw){
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = () => { const f = inp.files[0]; if (!f) return;
    const img = new Image();
    img.onload = () => { // 中央を正方形に切り抜いて200pxに縮小
      const s = Math.min(img.width, img.height), c = document.createElement('canvas'); c.width = c.height = 200;
      c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 200, 200);
      URL.revokeObjectURL(img.src); state.photo = c.toDataURL('image/jpeg', 0.8); redraw();
    };
    img.onerror = () => toast('この画像は読み込めませんでした');
    img.src = URL.createObjectURL(f);
  };
  inp.click();
}

/* ===================== 初回設定 ===================== */
let setupState = { mode:null, code:'', famName:'岩崎家', name:'', base:'👨', tone:'', color:COLORS[0], photo:null, existing:null };
function genCode(){ const c = 'abcdefghjkmnpqrstuvwxyz23456789'; let s = ''; for (let i = 0; i < 4; i++) s += c[Math.floor(Math.random() * c.length)]; return 'iwasaki-' + s; }

function showSetup(step){
  $('#setup').classList.remove('hide');
  const S = setupState, joinParam = new URLSearchParams(location.search).get('join');
  if (!step && joinParam) { S.mode = 'join'; S.code = joinParam; step = 'join'; }
  let h = `<div class="box"><div class="hero"><img src="icon-192.png" alt=""><h1>みどりのかご</h1><div style="color:var(--sub)">家族で使う買い物・やることリスト</div></div>`;
  if (!step) {
    h += `<div class="card"><button class="btn pri full" onclick="setupState.mode='create';setupState.code=genCode();showSetup('create')">🌱 新しく家族リストを作る</button>
      <div style="height:10px"></div><button class="btn full" onclick="setupState.mode='join';showSetup('join')">🔑 家族コードで参加する</button></div>
      <p class="hint" style="text-align:center">家族のだれか1人が「作る」→ 表示される家族コードを共有すると、ほかの人が参加できます。</p>`;
  } else if (step === 'create') {
    h += `<div class="card"><div class="fld"><label>家族の名前</label><input class="in" id="sFam" value="${esc(S.famName)}"></div>
      <div class="fld"><label>家族コード（あとで共有します）</label><div class="code">${esc(S.code)}</div>
      <div class="hint">このコードを知っている人だけが参加できます。</div></div></div>`;
    h += profileForm();
  } else if (step === 'join') {
    h += `<div class="card"><div class="fld"><label>家族コード</label><input class="in" id="sCode" placeholder="iwasaki-xxxx" value="${esc(S.code)}" autocapitalize="off" autocomplete="off">
      </div><button class="btn full" onclick="checkCode()">コードを確認</button><div id="codeRes" class="hint"></div></div>`;
    if (S.existing) h += existingForm() + profileForm();
  }
  if (step) h += `<p style="text-align:center"><button class="btn small" onclick="setupState.existing=null;showSetup()">← もどる</button></p>`;
  $('#setup').innerHTML = h + `</div>`;
  if (step === 'join' && S.code && !S.existing && joinParam) checkCode();
}
function profileForm(){
  return `<div class="card"><div class="fld"><label>あなたの名前</label><input class="in" id="sName" placeholder="例：りょう" value="${esc(setupState.name)}"></div>
    ${avatarPicker('setupState', 'syncSetup')}<button class="btn pri full" onclick="finishSetup()">はじめる</button></div>`;
}
function existingForm(){
  const ms = Object.entries(setupState.existing.members || {});
  if (!ms.length) return '';
  return `<div class="card"><label class="hint" style="font-weight:700">登録済みのメンバーとして使う</label><div class="mlist">${ms.map(([id, m]) =>
    `<div class="mi">${avatarOf(m)}<b style="flex:1">${esc(m.name)}</b><button class="btn small" onclick="useExisting('${id}')">この人で使う</button></div>`).join('')}</div>
     <div class="hint">新しく参加する人は下で名前を入れてください。</div></div>`;
}
function syncSetup(){ const n = $('#sName'), f = $('#sFam'); if (n) setupState.name = n.value; if (f) setupState.famName = f.value; showSetup(setupState.mode); }
async function checkCode(){
  const c = ($('#sCode').value || '').trim().toLowerCase().replace(/[^a-z0-9-]/g, '');
  setupState.code = c; if (!c) return;
  $('#codeRes').textContent = '確認中…';
  try { // 非公開データを読まないよう meta と members だけ取得
    const [m, mem] = await Promise.all([db.ref(`familylist/${c}/meta`).once('value'), db.ref(`familylist/${c}/members`).once('value')]);
    if (!m.exists()) { $('#codeRes').textContent = 'このコードの家族は見つかりませんでした。'; return; }
    setupState.existing = { meta: m.val(), members: mem.val() || {} }; showSetup('join');
    $('#codeRes').textContent = '✅ ' + (m.val().name || '') + ' が見つかりました';
  } catch (e) { $('#codeRes').textContent = '接続エラー：' + e.message; }
}
function useExisting(id){ FAM = setupState.code; ME = id; LS.set('fam', FAM); LS.set('me', ME); enterApp(); }
const profVal = s => ({ name: s.name.trim(), emoji: withTone(s.base, s.tone), color: s.color, photo: s.photo || null });
async function finishSetup(){
  const S = setupState; const n = $('#sName'); if (n) S.name = n.value; const f = $('#sFam'); if (f) S.famName = f.value.trim() || '岩崎家';
  if (!S.name.trim()) { toast('名前を入れてください'); return; }
  FAM = S.code; ME = uid();
  if (S.mode === 'create') {
    const [l1, l2, l3, l4] = [uid(), uid(), uid(), uid()];
    await db.ref('familylist/' + FAM).set({
      meta: { name: S.famName, createdAt: TS, todoInit: true },
      stores: DEF_STORES,
      lists: { [l1]: { name:'買い物リスト', type:'shop', order:1 }, [l4]: { name:'家のやること', type:'todo', order:1.5 },
               [l2]: { name:'やりたい事', type:'check', order:2 }, [l3]: { name:'持ち物', type:'check', order:3 } },
      members: { [ME]: { ...profVal(S), joinedAt: TS } }
    });
  } else {
    await R('members/' + ME).set({ ...profVal(S), joinedAt: TS });
  }

/* ===================== 接続 ===================== */
function enterApp(){
  history.replaceState(null, '', location.pathname);
  $('#setup').classList.add('hide'); ['#hdr', '#fab'].forEach(s => $(s).classList.remove('hide'));
  if (SR) $('#mic').classList.remove('hide');
  refs.forEach(r => r.off()); refs = []; loaded = new Set(); D = {}; P = {}; migrated = false;
  // 共有データは項目ごとに購読（private 以下は読み込まない＝相手の非公開リストは端末に一切届かない）
  for (const k of ['meta', 'members', 'lists', 'items', 'stores', 'history', 'shopping']) {
    const r = R(k); refs.push(r);
    r.on('value', s => { D[k] = s.val(); loaded.add(k); if (loaded.size >= 7) { migrate(); render(); } });
  }
  PK = LS.get('pk_' + FAM); listenPrivate();
  db.ref('.info/connected').on('value', s => $('#net').classList.toggle('hide', !!s.val()));
}
function listenPrivate(){
  if (privRef) privRef.off(); P = {}; privRef = null;
  if (!PK) return;
  privRef = R('private/' + PK); privRef.on('value', s => { P = s.val() || {}; render(); });
}
function ensurePK(){ if (!PK) { PK = rand32(); LS.set('pk_' + FAM, PK); listenPrivate(); } return PK; }
// 既存データへの追加（壊さず足すだけ）
function migrate(){
  if (migrated || !D.meta) return; migrated = true;
  const u = {};
  if (!D.meta.todoInit) {
    if (!Object.values(D.lists || {}).some(l => l.type === 'todo')) u['lists/' + uid()] = { name:'家のやること', type:'todo', order:1.5 };
    u['meta/todoInit'] = true;
  }
  if (Object.keys(u).length) R().update(u);
}

/* ===================== 描画 ===================== */
function render(){
  if (loaded.size < 7) return;
  $('#famName').textContent = (D.meta && D.meta.name) || '岩崎家';
  $('#mems').innerHTML = Object.keys(D.members || {}).map(id => avatar(id)).join('');

  // 近い期限バッジ
  const u = urgentCount(), due = $('#due');
  due.classList.toggle('hide', !u.n); due.classList.toggle('red', u.late > 0);
  due.textContent = `⏰ ${u.n}`; due.title = `期限切れ${u.late}件・3日以内${u.n - u.late}件`;

  // 買い物中バナー：共有分は全員に。非公開リストの買い物モードはこの端末だけ（店名も相手に出ない）
  let b = activeShops().map(([id, s]) => {
    const me = id === ME;
    return `<div class="banner ${me ? 'me' : ''}">${avatar(id, 'sm')}<span class="t">🛒 ${esc(me ? 'あなた' : member(id).name)}が${esc(s.store)}で買い物中</span>
      ${me ? `<button onclick="endShopping(false)">終了</button>` : ''}</div>`;
  }).join('');
  if (privShop()) b += `<div class="banner priv">🔒<span class="t">自分だけの買い物モード：${esc(privShop())}（家族には表示されません）</span><button onclick="endShopping(true)">終了</button></div>`;
  $('#banners').innerHTML = b;

  // 起動時ショートカット（?list=shop / ?list=todo）
  const ls = lists();
  if (startType) { const t = ls.find(l => l.type === startType && !l.priv); if (t) { cur = t.id; LS.set('list', cur); startType = null; } }
  if (!ls.find(l => l.id === cur)) cur = ls[0] && ls[0].id;

  $('#tabs').innerHTML = ls.map(l => {
    const its = items(l.id).filter(i => !i.done); let n = its.length, hot = false;
    if (l.type === 'todo') hot = its.some(i => i.date && dayDiff(i.date) <= 3);
    return `<button class="tab ${l.id === cur ? 'on' : ''}" onclick="tabTap('${l.id}')">${l.priv ? '🔒 ' : ''}${esc(l.name)}${n ? `<span class="cnt ${hot ? 'hot' : ''}">${n}</span>` : ''}${l.id === cur ? '<span class="ed">✎</span>' : ''}</button>`;
  }).join('') + `<button class="tab add" onclick="listSheet()" aria-label="リスト追加">＋</button>`;

  const L = ls.find(l => l.id === cur);
  if (!L) { $('#wrap').innerHTML = `<div class="empty">リストがありません。上の＋で作ってください。</div>`; return; }
  let h = L.priv ? `<div class="privnote">🔒 このリストは自分だけに表示されます（${esc(otherNames())}には見えません）</div>` : '';
  if (L.type === 'todo') h += renderTodo(L);
  else if (L.type === 'shop') h += renderShop(L);
  else h += renderCheck(L);
  $('#wrap').innerHTML = h;
}

function renderShop(L){
  const all = items(L.id), ms = myShop(L.id);
  let h = `<div class="tools">` + (ms ? `<button class="btn pri" onclick="endShopping(${L.priv})">🏁 ${esc(ms)}の買い物を終える</button>`
                                       : `<button class="btn pri" onclick="shopSheet()">🛒 買い物に行く</button>`) + `</div>`;
  // いつもの（共有の購入履歴から）
  const act = new Set(all.filter(i => !i.done).map(i => i.name));
  const us = Object.values(D.history || {}).filter(x => !act.has(x.name)).sort((a, b) => b.count - a.count).slice(0, 15);
  if (us.length) h += `<div class="usual"><h4>⭐ いつもの（タップで追加）</h4><div class="chips">${us.map(u =>
    `<button class="chip" onclick='quickAdd(${JSON.stringify(u.name).replace(/'/g, "&#39;")})'>＋ ${esc(u.name)}</button>`).join('')}</div></div>`;
  let a = all.filter(i => !i.done); const done = all.filter(i => i.done).sort((x, y) => (y.doneAt || 0) - (x.doneAt || 0));
  if (ms) { // 買い物モード：その店（＋店指定なし）の品を売り場順に
    a = a.filter(i => !i.store || i.store === ms);
    if (!a.length) h += `<div class="empty">🎉 ${esc(ms)}で買う物はもうありません</div>`;
    for (const c of CATS) { const g = a.filter(i => (i.cat || 'その他') === c); if (g.length) h += `<div class="sec">${CAT_ICON[c]} ${c}</div>` + g.map(i => row(i, L)).join(''); }
  } else h += a.length ? a.map(i => row(i, L)).join('') : `<div class="empty">🧺 リストは空っぽです<br>右下の＋か🎤で追加しましょう</div>`;
  if (done.length) {
    h += `<div class="donehd"><button class="lbl" onclick="showDone=!showDone;render()">${showDone ? '▾' : '▸'} 購入済み（${done.length}）</button>
      <button class="btn small warn" onclick="clearDone()">購入済みを片付ける</button></div>`;
    if (showDone) h += done.map(i => row(i, L)).join('');
  }
  return h;
}
function renderCheck(L){
  const all = items(L.id);
  return `<div class="tools"><button class="btn" onclick="uncheckAll()">↺ 全部のチェックを外す</button></div>` +
    (all.length ? all.map(i => row(i, L)).join('') : `<div class="empty">まだ項目がありません<br>右下の＋で追加しましょう</div>`);
}
function row(i, L){
  const shop = L.type === 'shop', mine = i.claimBy === ME, other = i.claimBy && !mine && !i.done;
  let meta = '';
  if (shop && i.cat) meta += `<span class="tag">${CAT_ICON[i.cat] || ''} ${esc(i.cat)}</span>`;
  if (i.store) meta += `<span class="tag">🏪 ${esc(i.store)}</span>`;
  if (i.claimBy && !i.done) meta += `<span class="tag cl">${avatar(i.claimBy, 'xs')} ${esc(mine ? 'あなた' : member(i.claimBy).name)}が担当中</span>`;
  if (i.done && i.doneBy) meta += `<span class="tag">✓ ${esc(member(i.doneBy).name)} ${fmt(i.doneAt)}</span>`;
  if (i.memo) meta += `<span class="tag memo">📝 ${esc(i.memo)}</span>`;
  const claimBtn = shop && !i.done
    ? `<button class="claim ${i.claimBy ? 'on' : ''}" onclick="toggleClaim('${i.id}')">${i.claimBy ? avatar(i.claimBy, 'sm') + '<br>担当中' : '🙋<br>私が買う'}</button>`
    : (shop && i.done ? `<button class="btn small" onclick="toggleDone('${i.id}')">元に戻す</button>` : '');
  return `<div class="item ${i.done ? 'done' : ''} ${other ? 'other' : ''} ${mine && !i.done ? 'mine' : ''}">
    <button class="chk" onclick="toggleDone('${i.id}')" aria-label="チェック">✓</button>
    <div class="body" onclick="${shop && !i.done ? `toggleClaim('${i.id}')` : `toggleDone('${i.id}')`}">
      <div class="nm">${esc(i.name)}${i.qty ? `<span class="qty">×${esc(i.qty)}</span>` : ''}</div>${meta ? `<div class="meta">${meta}</div>` : ''}</div>
    ${claimBtn}<button class="more" onclick="itemSheet('${i.id}')" aria-label="編集">⋯</button></div>`;
}

// ---- やることリスト ----
function renderTodo(L){
  const tf = L.priv ? 'all' : (LS.get('tf') || 'all');
  const pass = i => tf === 'all' || (tf === 'me' ? (i.who === ME || i.who === 'both') : (i.who && i.who !== ME));
  const all = items(L.id).filter(pass);
  const act = all.filter(i => !i.done).sort((a, b) => (a.date || '9999') < (b.date || '9999') ? -1 : (a.date || '9999') > (b.date || '9999') ? 1 : (a.at || 0) - (b.at || 0));
  const done = all.filter(i => i.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
  let h = '';
  if (!L.priv) h += `<div class="tools"><div class="seg">${[['all', '全部'], ['me', '👤 自分'], ['other', '👥 相手']].map(([v, t]) =>
    `<button class="${tf === v ? 'on' : ''}" onclick="LS.set('tf','${v}');render()">${t}</button>`).join('')}</div></div>`;
  if (!act.length) h += `<div class="empty">✨ やることはありません<br>右下の＋で「習字代振込 〜12/5」のように追加</div>`;
  GROUPS.forEach(([t, cls], gi) => {
    const g = act.filter(i => grp(i) === gi); if (!g.length) return;
    h += `<div class="sec ${cls}">${t} <span class="n">${g.length}件</span></div>` + g.map(i => todoRow(i, gi)).join('');
  });
  if (done.length) {
    h += `<div class="donehd"><button class="lbl" onclick="showDone=!showDone;render()">${showDone ? '▾' : '▸'} 完了済み（${done.length}）</button>
      <button class="btn small warn" onclick="clearDone()">完了済みを片付ける</button></div>`;
    if (showDone) h += done.map(i => todoRow(i, -1)).join('');
  }
  return h;
}
function todoRow(i, gi){
  let meta = '';
  if (i.date) {
    const n = dayDiff(i.date), rel = n < 0 ? `${-n}日過ぎ` : n === 0 ? '今日' : n === 1 ? '明日' : `あと${n}日`;
    const cls = i.done ? '' : n < 0 ? 'red' : n <= 1 ? 'orange' : '';
    meta += `<span class="tag dt ${cls}">${i.dtype === 'on' ? '📌 ' : '⏳ 〜'}${dLabel(i.date)}${i.done ? '' : '・' + rel}</span>`;
  }
  if (i.repeat) meta += `<span class="tag">🔁 ${i.repeat === 'monthly' ? `毎月${i.rday}日` : '毎年'}</span>`;
  if (i.done && i.doneBy) meta += `<span class="tag">✓ ${esc(member(i.doneBy).name)} ${fmt(i.doneAt)}</span>`;
  if (i.memo) meta += `<span class="tag memo">📝 ${esc(i.memo)}</span>`;
  const who = i.who === 'both' ? Object.keys(D.members || {}).slice(0, 3) : (i.who ? [i.who] : []);
  return `<div class="item ${i.done ? 'done' : ''} ${gi === 0 ? 'late' : gi === 1 ? 'soon' : ''}">
    <button class="chk" onclick="toggleDone('${i.id}')" aria-label="完了">✓</button>
    <div class="body" onclick="itemSheet('${i.id}')"><div class="nm">${esc(i.name)}</div>${meta ? `<div class="meta">${meta}</div>` : ''}</div>
    ${who.length && !isPriv(cur) ? `<div class="whos">${who.map(id => avatar(id, 'sm')).join('')}</div>` : ''}</div>`;
}

function tabTap(id){ if (id === cur) listSheet(id); else { cur = id; LS.set('list', id); showDone = false; render(); } }

function addItems(names, opt = {}){
  const L = curList(), ms = myShop();
  names.forEach((raw, k) => {
    const base = { done: false, at: Date.now() + k, by: ME, memo: opt.memo || '' };
    if (L.type === 'todo') { // やること：文中の日付を自動で読む
      const p = parseTodo(raw); if (!p.name) return;
      LR(cur).push({ ...base, name: p.name, date: p.date || '', dtype: p.dtype || '', who: '', repeat: '', rday: 0 }); return;
    }
    const p = parseQty(raw); if (!p.name) return;
    const h = (D.history || {})[key(p.name)];
    LR(cur).push({ ...base, name: p.name, qty: opt.qty || p.qty || '',
      store: opt.store !== undefined ? opt.store : (h && h.store) || ms || '',
      cat: L.type === 'shop' ? (opt.cat || (h && h.cat) || guessCat(p.name)) : '' });
  });
}
function quickAdd(name){ addItems([name]); toast(`「${name}」を追加しました`); }

function toggleClaim(id){
  const it = getItem(id); if (!it || it.done) return;
  if (it.claimBy === ME) return IR(id).update({ claimBy: null });
  if (it.claimBy && !confirm(`${member(it.claimBy).name}が担当中です。代わりにあなたが担当しますか？`)) return;
  IR(id).update({ claimBy: ME, claimAt: TS });
}
function toggleDone(id){
  const it = getItem(id), L = curList(); if (!it) return;
  if (L.type === 'todo') {
    const u = {};
    if (it.done) { // 元に戻す：自動作成した次回分（未完了なら）も取り消す
      Object.assign(u, { [id + '/done']: false, [id + '/doneBy']: null, [id + '/doneAt']: null, [id + '/nextId']: null });
      if (it.nextId) { const nx = getItem(it.nextId); if (nx && !nx.done) u[it.nextId] = null; }
    } else {
      Object.assign(u, { [id + '/done']: true, [id + '/doneBy']: ME, [id + '/doneAt']: TS });
      if (it.repeat && it.date) { // 繰り返し：次回分を作成
        const nid = LR(cur).push().key, nd = nextDate(it.date, it.repeat, it.rday);
        u[id + '/nextId'] = nid;
        u[nid] = { name: it.name, memo: it.memo || '', date: nd, dtype: it.dtype || 'due', who: it.who || '', repeat: it.repeat, rday: it.rday || 0, done: false, at: Date.now(), by: ME };
        toast(`完了！次回 ${dLabel(nd)} を作成しました`);
      }
    }
    return LR(cur).update(u);
  }
  if (it.done) return IR(id).update({ done: false, doneBy: null, doneAt: null });
  IR(id).update({ done: true, doneBy: ME, doneAt: TS, claimBy: null });
  if (L.type === 'shop' && !isPriv(cur)) // 購入履歴（いつもの用）。非公開リストは履歴に残さない＝相手に気配が出ない
    R('history/' + key(it.name)).transaction(h => ({ name: it.name, cat: it.cat || '', store: it.store || '', count: ((h && h.count) || 0) + 1, last: Date.now() }));
}
function clearDone(){
  const done = items(cur).filter(i => i.done); if (!done.length) return;
  if (!confirm(`完了・購入済み${done.length}件をリストから消します。よろしいですか？`)) return;
  const u = {}; done.forEach(i => u[i.id] = null); LR(cur).update(u); toast('片付けました');
}
function uncheckAll(){

}

function addStore(){ const v = $('#newStore').value.trim(); if (!v) return; R('stores').set([...stores(), v]); setTimeout(settingsSheet, 300); }
function delStore(i){ const a = stores(); a.splice(i, 1); R('stores').set(a); setTimeout(settingsSheet, 300); }

let pf = {};
function profileSheet(newMember){
  const m = newMember ? { name:'', emoji:'👧', color:COLORS[4] } : member(ME), t = splitTone(m.emoji || '👨');
  pf = { name: m.name, base: t.base, tone: t.tone, color: m.color, photo: m.photo || null, newMember };
  drawProfile();
}
function drawProfile(){
  openSheet(hd(pf.newMember ? '＋ メンバーを追加' : '🙂 アバター・名前') +
    `<div class="fld"><label>名前</label><input class="in" id="pName" value="${esc(pf.name)}" oninput="pf.name=this.value"></div>
     ${avatarPicker('pf', 'drawProfile')}<button class="btn pri full" onclick="saveProfile()">保存</button>
     ${pf.newMember ? '<div class="hint">スマホを持っていない家族（子どもなど）を登録できます。本人のスマホで参加する場合は招待リンクを送ってください。</div>' : ''}`);
}
function saveProfile(){
  if (!pf.name.trim()) return toast('名前を入れてください');
  const v = profVal(pf);
  if (pf.newMember) R('members/' + uid()).set({ ...v, joinedAt: TS }); else R('members/' + ME).update(v);
  closeSheet(); toast('保存しました');
}
$('#gear').onclick = settingsSheet;
$('#mems').onclick = settingsSheet;
$('#fab').onclick = () => itemSheet();
$('#due').onclick = () => { // 近い期限があるやることリストへ
  const l = lists().find(l => l.type === 'todo' && items(l.id).some(i => !i.done && i.date && dayDiff(i.date) <= 3));
  if (l) { cur = l.id; LS.set('list', cur); LS.set('tf', 'all'); render(); }
};

/* ===================== 音声入力 ===================== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
$('#mic').onclick = () => {
  const r = new SR(); r.lang = 'ja-JP'; r.interimResults = false; r.maxAlternatives = 1;
  $('#mic').classList.add('rec'); toast('🎤 どうぞ（例：「卵と牛乳」）');
  r.onresult = e => {
    const t = e.results[0][0].transcript, names = splitNames(t, curList().type !== 'todo');
    if (names.length) { addItems(names); toast('追加：' + names.join('・')); } else toast('聞き取れませんでした');
  };
  r.onerror = e => toast('音声入力エラー：' + e.error);
  r.onend = () => $('#mic').classList.remove('rec');
  r.start();
};

/* ===================== 起動 ===================== */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
setInterval(() => { // 4時間以上たった自分の「買い物中」を自動で消す＆日付の表示更新
  if (D.shopping && D.shopping[ME] && !myShop('')) R('shopping/' + ME).remove();
  if (LS.get('pshop') && !privShop()) LS.del('pshop');
  render();
}, 60e3);
if (FAM && ME) enterApp(); else showSetup();
</script>
